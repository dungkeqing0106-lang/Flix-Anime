<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Vietsub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15131f;--sf:#1f1c2e;--ln:#332f47;--tx:#eceaf5;--mu:#9a96b3;--ac:#a99bff;--hot:#ffd36b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 "Be Vietnam Pro",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(21,19,31,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:14px;align-items:center}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.logo i{font-style:normal;color:var(--ac)}
form{flex:1;display:flex}
input,select,button{font:inherit;color:inherit}
input[type=search]{flex:1;min-width:0;background:var(--sf);border:1px solid var(--ln);border-radius:10px 0 0 10px;padding:9px 14px}
form button{background:var(--ac);color:#14102b;border:0;border-radius:0 10px 10px 0;padding:0 16px;font-weight:700;cursor:pointer}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,6vw,46px);line-height:1.1;letter-spacing:-.03em;margin:28px 0 8px;font-weight:800}
h2{font-size:18px;margin:28px 0 12px}
.mu{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{border:1px solid var(--ln);background:var(--sf);padding:6px 14px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}
.card .im{aspect-ratio:2/3;border-radius:8px;background:var(--sf) center/cover;border:1px solid var(--ln)}
.card b{display:block;font-weight:500;font-size:14px;margin-top:8px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover .im{border-color:var(--ac)}
#player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 0 80px -20px rgba(169,155,255,.35)}
#player video,#player iframe{width:100%;height:100%;border:0;display:block}
.msg{height:100%;display:grid;place-items:center;color:var(--mu);padding:20px;text-align:center}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
select,.btn{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.sp{flex:1}
.info{display:grid;grid-template-columns:170px 1fr;gap:20px;margin-top:24px}
.info .im{aspect-ratio:2/3;border-radius:10px;background:var(--sf) center/cover;border:1px solid var(--ln)}
.info h1{margin:0 0 8px;font-size:clamp(22px,4vw,32px)}
.info p{max-width:70ch;color:#c9c6dc;margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;padding:2px 10px;border:1px solid var(--ln);border-radius:99px;color:var(--mu)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.eps a{text-align:center;padding:8px 0;background:var(--sf);border:1px solid var(--ln);border-radius:8px}
.eps a:hover{border-color:var(--ac)}
.eps a.on{background:var(--hot);color:#2a2000;border-color:var(--hot);font-weight:700}
.err{color:#ff9c9c;padding:20px 0}
@media(max-width:600px){.info{grid-template-columns:110px 1fr}.logo{font-size:16px}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">anime<i>vietsub</i></a>
  <form id="f"><input id="q" type="search" placeholder="Tìm anime…" aria-label="Tìm anime" autocomplete="off"><button>Tìm</button></form>
</div></header>
<main id="v"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
// Chế độ: (1) có server cùng origin hoặc ?api=URL -> dùng server; (2) không có (vd GitHub Pages) -> gọi thẳng AniMapper.
// ?proxy=URL_server để phát HLS qua proxy khi chạy chế độ (2).
let API = '', DIRECT = false, PROXY = '';
const $ = s => document.querySelector(s), view = $('#v');
let hls = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title = m => typeof m.title === 'string' ? m.title :
  (m.title && (m.title.vietnamese || m.title.english || m.title.romaji || m.title.native)) || m.name || 'Không có tên';
const cover = m => { const c = m.coverImage; return (c && (c.extraLarge || c.large || c.medium)) || (typeof c === 'string' ? c : '') || m.image || m.cover || m.poster || ''; };
const plain = h => String(h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

const UP = 'https://api.animapper.net/api/v1';
{ const p = new URLSearchParams(location.search);
  for (const k of ['api', 'proxy']) if (p.has(k)) store.set('cfg:' + k, p.get(k)); }
const clean = s => (s || '').replace(/\/$/, '');
async function detect() {
  PROXY = clean(store.get('cfg:proxy'));
  API = clean(store.get('cfg:api'));
  if (API) return;
  try { const d = await (await fetch('/health')).json(); if (!d.ok) throw 0; }
  catch { DIRECT = true; }
}
async function json(url) {
  const r = await fetch(url);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.message || 'Lỗi ' + r.status);
  return d;
}
const b64u = o => btoa(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function direct(path) {
  const u = new URL(path, location.origin), q = u.searchParams, seg = u.pathname.split('/').filter(Boolean);
  const U = (p, o) => { const s = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v) s.set(k, v); return `${UP}${p}?${s}`; };
  if (seg[1] === 'search') return json(`${UP}/search?${q}`);
  const id = seg[2], sub = seg[3], provider = q.get('provider'), server = q.get('server');
  if (!sub) return json(U('/metadata', { id }));
  if (sub === 'servers') return json(U('/stream/episodes/servers', { id, provider }));
  if (sub === 'episodes') return json(U('/stream/episodes', { id, provider, server }));
  return (async () => {
    const list = await json(U('/stream/episodes', { id, provider, server }));
    const want = decodeURIComponent(seg[4]);
    const ep = (list.episodes || []).find(e => String(e.episodeNumber) === want);
    if (!ep) throw new Error('Không có tập này');
    const src = await json(U('/stream/source', { episodeData: ep.episodeId, provider, server: server || ep.server }));
    if (src.type === 'HLS' && PROXY)
      src.url = `${PROXY}/api/proxy?u=${encodeURIComponent(src.url)}` + (src.proxyHeaders ? `&h=${b64u(src.proxyHeaders)}` : '');
    return { episode: ep, source: src };
  })();
}
const get = path => DIRECT ? direct(path) : json(API + path);
const card = m => `<a class="card" href="#/a/${m.id}"><div class="im" style="background-image:url('${esc(cover(m))}')"></div><b>${esc(title(m))}</b></a>`;

/* ---------- Trang chủ / tìm kiếm ---------- */
function home() {
  document.title = 'Anime Vietsub';
  view.innerHTML = `<h1>Xem anime vietsub</h1><p class="mu">Gõ tên anime ở ô tìm kiếm, hoặc thử một trong các gợi ý.</p>
  <div class="chips">${['Attack on Titan','One Piece','Frieren','Demon Slayer','Jujutsu Kaisen','Spy x Family'].map(t => `<a class="chip" href="#/s/${encodeURIComponent(t)}">${t}</a>`).join('')}</div>`;
}
async function search(q) {
  document.title = q + ' – Anime Vietsub';
  $('#q').value = q;
  view.innerHTML = `<h2>Kết quả cho “${esc(q)}”</h2><p class="mu">Đang tìm…</p>`;
  const d = await get(`/api/search?title=${encodeURIComponent(q)}&mediaType=ANIME&limit=30`);
  const list = d.results || d.data || d.media || [];
  view.innerHTML = `<h2>Kết quả cho “${esc(q)}”</h2>` + (list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '<p class="mu">Không tìm thấy anime nào. Thử từ khoá khác, ví dụ tên tiếng Anh hoặc romaji.</p>');
}

/* ---------- Trang anime + trình phát ---------- */
function play(src) {
  const box = $('#player');
  if (hls) { hls.destroy(); hls = null; }
  if (src.type === 'EMBED') {
    box.innerHTML = `<iframe src="${esc(src.url)}" allowfullscreen allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>`;
    return;
  }
  box.innerHTML = '<video controls autoplay playsinline></video>';
  const v = box.firstChild;
  if (src.type === 'HLS' && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(src.url);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, e) => { if (e.fatal) box.innerHTML = `<div class="msg">Không phát được tập này. ${DIRECT && !PROXY ? 'Nguồn HLS cần proxy: thêm ?proxy=URL_server_của_bạn vào địa chỉ trang.' : 'Thử đổi server khác.'}</div>`; });
  } else v.src = src.url;
}

async function anime(id, q) {
  view.innerHTML = '<p class="mu">Đang tải…</p>';
  const meta = (await get(`/api/anime/${id}`)).result || {};
  document.title = title(meta) + ' – Anime Vietsub';
  const providers = Object.keys(meta.streamingProviders || {});
  const provider = q.get('p') || providers[0];
  const epNow = q.get('ep');
  let server = q.get('s') || '';
  let servers = [], eps = [], watch = null, note = '';

  if (!provider) note = 'Anime này chưa có nguồn phát.';
  else {
    try {
      servers = (await get(`/api/anime/${id}/servers?provider=${provider}`)).servers || [];
      eps = (await get(`/api/anime/${id}/episodes?provider=${provider}${server ? '&server=' + server : ''}`)).episodes || [];
      if (!eps.length) note = 'Provider này chưa có tập nào. Thử chọn nguồn khác.';
    } catch (e) { note = e.message; }
  }

  const link = (ep, o = {}) => `#/a/${id}?ep=${encodeURIComponent(ep)}&p=${o.p || provider}${(o.s ?? server) ? '&s=' + (o.s ?? server) : ''}`;
  const idx = eps.findIndex(e => String(e.episodeNumber) === String(epNow));
  const prev = eps[idx - 1], next = eps[idx + 1];
  const saved = store.get('ep:' + id);

  const desc = plain(meta.description);
  view.innerHTML = `
  ${epNow ? '<div id="player"><div class="msg">Đang tải tập ' + esc(epNow) + '…</div></div>' : ''}
  ${eps.length ? `<div class="ctl">
    <select id="sp" aria-label="Nguồn">${providers.map(p => `<option ${p === provider ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
    ${servers.length ? `<select id="ss" aria-label="Server"><option value="">Server mặc định</option>${servers.map(s => `<option ${s === server ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>` : ''}
    <span class="sp"></span>
    ${epNow ? `<a class="btn" aria-disabled="${!prev}" href="${prev ? link(prev.episodeNumber) : '#'}">Tập trước</a><a class="btn" aria-disabled="${!next}" href="${next ? link(next.episodeNumber) : '#'}">Tập sau</a>`
      : `<a class="btn" href="${link(saved && eps.some(e => e.episodeNumber == saved) ? saved : eps[0].episodeNumber)}">${saved ? 'Xem tiếp tập ' + esc(saved) : 'Xem từ tập đầu'}</a>`}
  </div>` : ''}
  <div class="info">
    <div class="im" style="background-image:url('${esc(cover(meta))}')"></div>
    <div><h1>${esc(title(meta))}</h1>
      <div class="tags">${(meta.genres || []).map(g => `<span>${esc(g)}</span>`).join('')}</div>
      <p>${esc(desc).slice(0, 700)}${desc.length > 700 ? '…' : ''}</p></div>
  </div>
  <h2>Danh sách tập${eps.length ? ' (' + eps.length + ')' : ''}</h2>
  ${note ? `<p class="mu">${esc(note)}</p>` : ''}
  <div class="eps">${eps.map(e => `<a href="${link(e.episodeNumber)}" class="${String(e.episodeNumber) === String(epNow) ? 'on' : ''}">${esc(e.episodeNumber)}</a>`).join('')}</div>`;

  const nav = (p, s) => { location.hash = `#/a/${id}?${epNow ? 'ep=' + encodeURIComponent(epNow) + '&' : ''}p=${p}${s ? '&s=' + s : ''}`; };
  $('#sp')?.addEventListener('change', e => nav(e.target.value, ''));
  $('#ss')?.addEventListener('change', e => nav(provider, e.target.value));

  if (epNow && eps.length) {
    store.set('ep:' + id, epNow);
    try {
      watch = await get(`/api/anime/${id}/watch/${encodeURIComponent(epNow)}?provider=${provider}${server ? '&server=' + server : ''}`);
      play(watch.source);
    } catch (e) { $('#player').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  } else if (epNow) $('#player').innerHTML = '<div class="msg">Không có tập này.</div>';
}

/* ---------- Router ---------- */
async function route() {
  if (hls) { hls.destroy(); hls = null; }
  const [path, qs] = (location.hash.slice(1) || '/').split('?');
  const q = new URLSearchParams(qs || '');
  const parts = path.split('/').filter(Boolean);
  window.scrollTo(0, 0);
  try {
    if (parts[0] === 'a' && parts[1]) await anime(parts[1], q);
    else if (parts[0] === 's' && parts[1]) await search(decodeURIComponent(parts[1]));
    else home();
  } catch (e) { view.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
$('#f').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#q').value.trim();
  if (v) location.hash = '#/s/' + encodeURIComponent(v);
});
addEventListener('hashchange', route);
detect().then(route);
</script>
</body>
</html>
