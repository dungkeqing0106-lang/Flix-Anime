<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapper Cinema – Xem anime</title>
<style>
:root{--bg:#12101c;--surface:#1c1930;--surface2:#272343;--text:#efeaf7;--muted:#9a93b5;--accent:#ff6b8b;--line:#342f55;--r:10px}
@media (prefers-color-scheme:light){:root:not([data-x]){--bg:#f6f3fb;--surface:#fff;--surface2:#ece7f7;--text:#1d1a2e;--muted:#6b6585;--accent:#d93a63;--line:#ddd6ee}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:16px/1.55 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;display:flex;gap:16px;align-items:center;padding:12px 16px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.logo b{color:var(--accent)}
.search{flex:1;display:flex;max-width:520px;margin-left:auto}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r) 0 0 var(--r);padding:9px 14px}
.search button{background:var(--accent);color:#fff;border:0;border-radius:0 var(--r) var(--r) 0;padding:0 16px;cursor:pointer;font-weight:600}
main{max-width:1200px;margin:auto;padding:20px 16px 60px}
h1{font-size:28px;letter-spacing:-.02em;line-height:1.2}
h2{font-size:20px;margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{display:block}
.poster{aspect-ratio:2/3;border-radius:var(--r);background:var(--surface2) center/cover;position:relative;overflow:hidden;transition:transform .2s}
.card:hover .poster{transform:translateY(-3px)}
.tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
.card p{margin-top:8px;font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--muted)}
.more{display:block;margin:28px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 28px;cursor:pointer}
.msg{color:var(--muted);padding:40px 0;text-align:center}
.err{color:var(--accent)}
.banner{height:240px;margin:-20px -16px 0;background:var(--surface2) center/cover;position:relative}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg))}
.detail{display:grid;grid-template-columns:200px 1fr;gap:24px;margin-top:-90px;position:relative;z-index:1}
.detail .poster{box-shadow:0 10px 30px rgba(0,0,0,.4)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.meta span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 10px;font-size:13px;color:var(--muted)}
.desc{color:var(--muted);max-width:75ch;margin-top:8px}
.alt{color:var(--muted);font-size:14px;margin-top:2px}
.watch{margin-top:30px}
.player{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;position:relative}
.player video,.player iframe{width:100%;height:100%;border:0;display:block}
.player .msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;color:#bbb}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
.ctl label{font-size:14px;color:var(--muted)}
.ctl select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-left:6px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;max-height:260px;overflow:auto;padding:2px}
.ep{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 0;cursor:pointer;text-align:center;font-size:14px}
.ep[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.nav{display:flex;gap:8px;margin-left:auto}
.nav button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:640px){.detail{grid-template-columns:1fr;margin-top:-70px}.detail .poster{width:140px}.bar{flex-wrap:wrap}.search{max-width:none;flex-basis:100%;order:3}.banner{height:170px}h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">Mapper<b>Cinema</b></a>
  <form class="search" id="sf" role="search">
    <input id="q" type="search" placeholder="Tìm anime theo tên…" aria-label="Tìm anime" autocomplete="off">
    <button type="submit">Tìm</button>
  </form>
</div></header>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
const API = 'https://api.animapper.net/api/v1';
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title = t => t?.vi || t?.en || t?.ja || Object.values(t || {})[0] || 'Không rõ tên';
const SEASONS = {WINTER:'Đông',SPRING:'Xuân',SUMMER:'Hè',FALL:'Thu'};
const STATUS = {RELEASING:'Đang chiếu',FINISHED:'Hoàn thành',NOT_YET_RELEASED:'Sắp chiếu',CANCELLED:'Đã huỷ',HIATUS:'Tạm hoãn'};
let hls = null, token = 0;

async function api(path, params = {}) {
  const u = new URL(API + path);
  Object.entries(params).forEach(([k, v]) => v !== '' && v != null && u.searchParams.set(k, v));
  const r = await fetch(u);
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.success === false) throw new Error(j.message || 'Lỗi ' + r.status);
  return j;
}

const cardHTML = m => `<a class="card" href="#/a/${m.id}">
  <div class="poster" style="background-image:url('${esc(m.images?.coverLg || m.images?.coverXl || '')}');background-color:${esc(m.images?.coverColor || '')}">
    ${m.format ? `<span class="tag">${esc(m.format)}</span>` : ''}</div>
  <p>${esc(title(m.titles))}</p>
  <small>${esc([m.seasonYear, STATUS[m.status]].filter(Boolean).join(' · '))}</small></a>`;

/* ---------- Danh sách / tìm kiếm ---------- */
const SORTS = [
  ['Phổ biến', {sortBy:'POPULARITY', sortOrder:'DESC'}],
  ['Mới cập nhật', {sortBy:'UPDATED_AT', sortOrder:'DESC'}],
  ['Mới phát hành', {sortBy:'START_DATE', sortOrder:'DESC'}],
];
async function list(query = '', sortIdx = 0) {
  const my = ++token, pageSize = 24;
  let offset = 0;
  app.innerHTML = `
    <h1>${query ? `Kết quả cho “${esc(query)}”` : 'Khám phá anime'}</h1>
    ${query ? '' : `<div class="chips">${SORTS.map((s, i) => `<button class="chip" data-i="${i}" aria-pressed="${i == sortIdx}">${s[0]}</button>`).join('')}</div>`}
    <div class="grid" id="g"></div><div id="foot" class="msg">Đang tải…</div>`;
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => list('', +b.dataset.i));
  const g = $('#g'), foot = $('#foot');
  async function load() {
    foot.textContent = 'Đang tải…';
    try {
      const d = await api('/search', {title: query, mediaType: 'ANIME', limit: pageSize, offset, ...(query ? {} : SORTS[sortIdx][1])});
      if (my !== token) return;
      g.insertAdjacentHTML('beforeend', d.results.map(cardHTML).join(''));
      offset += d.results.length;
      if (!g.children.length) foot.textContent = 'Không tìm thấy anime nào. Thử từ khoá khác.';
      else if (d.hasNextPage) { foot.innerHTML = '<button class="more">Xem thêm</button>'; foot.className = ''; $('.more').onclick = load; }
      else foot.textContent = '';
    } catch (e) { if (my === token) { foot.className = 'msg err'; foot.textContent = e.message + ' – kiểm tra kết nối hoặc thử lại sau ít phút (giới hạn 60 yêu cầu/phút).'; } }
  }
  load();
}

/* ---------- Chi tiết + trình phát ---------- */
async function detail(id) {
  const my = ++token;
  killPlayer();
  app.innerHTML = '<div class="msg">Đang tải…</div>';
  let m;
  try { m = (await api('/metadata', {id})).result; }
  catch (e) { app.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  if (my !== token) return;
  document.title = title(m.titles) + ' – Mapper Cinema';
  const providers = Object.keys(m.streamingProviders || {});
  const desc = (m.descriptions?.vi || m.descriptions?.en || '').replace(/<[^>]+>/g, ' ');
  const alt = [m.titles?.en, m.titles?.ja].filter(t => t && t !== title(m.titles)).join(' · ');
  app.innerHTML = `
    <div class="banner" style="background-image:url('${esc(m.images?.bannerUrl || '')}')"></div>
    <div class="detail">
      <div class="poster" style="background-image:url('${esc(m.images?.coverXl || '')}')"></div>
      <div>
        <h1>${esc(title(m.titles))}</h1>
        ${alt ? `<div class="alt">${esc(alt)}</div>` : ''}
        <div class="meta">
          ${[m.format, STATUS[m.status], m.seasonYear && `${SEASONS[m.season] || ''} ${m.seasonYear}`.trim(), m.totalUnits && m.totalUnits + ' tập', m.unitDurationMin && m.unitDurationMin + ' phút/tập']
            .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}
        </div>
        <div class="meta">${(m.genres || []).map(g => `<span>${esc(g.name)}</span>`).join('')}</div>
        <p class="desc">${esc(desc.slice(0, 700))}${desc.length > 700 ? '…' : ''}</p>
      </div>
    </div>
    <section class="watch" aria-label="Xem phim">
      <h2>Xem phim</h2>
      ${providers.length ? `
      <div class="player" id="pl"><div class="msg">Chọn một tập để bắt đầu xem</div></div>
      <div class="ctl">
        <label>Nguồn <select id="prov">${providers.map(p => `<option>${esc(p)}</option>`).join('')}</select></label>
        <label>Server <select id="srv"></select></label>
        <div class="nav"><button id="prev">Tập trước</button><button id="next">Tập sau</button></div>
      </div>
      <div class="eps" id="eps"></div>` : '<div class="msg">Chưa có nguồn phát cho phim này.</div>'}
    </section>
    <p class="note">Dữ liệu và nguồn phát do AniMapper cung cấp; ánh xạ tự động nên đôi khi có thể sai hoặc thiếu tập.</p>`;
  if (providers.length) player(m, my);
}

function killPlayer() { if (hls) { hls.destroy(); hls = null; } }

function player(m, my) {
  const prov = $('#prov'), srv = $('#srv'), eps = $('#eps'), pl = $('#pl');
  let all = [], cur = -1, view = [];
  const key = 'last:' + m.id;
  const say = (t, cls = '') => pl.innerHTML = `<div class="msg ${cls}">${esc(t)}</div>`;

  async function loadEps() {
    killPlayer(); cur = -1;
    eps.innerHTML = '<div class="msg">Đang tải danh sách tập…</div>'; srv.innerHTML = '';
    try {
      const d = await api('/stream/episodes', {id: m.id, provider: prov.value});
      if (my !== token) return;
      all = d.episodes || [];
      const servers = [...new Set(all.map(e => e.server).filter(Boolean))];
      srv.innerHTML = servers.map(s => `<option>${esc(s)}</option>`).join('') || '<option value="">Mặc định</option>';
      renderEps();
    } catch (e) { eps.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  }
  function renderEps() {
    view = srv.value ? all.filter(e => e.server === srv.value) : all;
    eps.innerHTML = view.map((e, i) => `<button class="ep" data-i="${i}">${esc(e.episodeNumber)}</button>`).join('') || '<div class="msg">Không có tập nào.</div>';
    eps.querySelectorAll('.ep').forEach(b => b.onclick = () => play(+b.dataset.i));
    const saved = localStorage.getItem(key);
    const i = saved ? view.findIndex(e => e.episodeNumber === saved) : -1;
    cur = -1; nav();
    if (i >= 0) play(i);
  }
  function nav() {
    $('#prev').disabled = cur <= 0; $('#next').disabled = cur < 0 || cur >= view.length - 1;
    eps.querySelectorAll('.ep').forEach((b, i) => i === cur ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current'));
  }
  async function play(i) {
    const e = view[i]; if (!e) return;
    cur = i; nav(); killPlayer();
    try { localStorage.setItem(key, e.episodeNumber); } catch {}
    say('Đang lấy nguồn phát…');
    const my2 = ++play.n;
    try {
      const s = await api('/stream/source', {episodeData: e.episodeId, provider: prov.value, server: e.server || srv.value});
      if (my2 !== play.n || my !== token) return;
      const type = (s.type || '').toUpperCase();
      if (type === 'EMBED') {
        pl.innerHTML = `<iframe src="${esc(s.url)}" allowfullscreen allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>`;
      } else {
        pl.innerHTML = '<video controls autoplay playsinline></video>';
        const v = $('video', pl);
        const fail = () => pl.insertAdjacentHTML('beforeend', `<div class="msg err" style="background:#000">Không phát được nguồn này. Thử server khác hoặc <a style="text-decoration:underline" target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">mở link trực tiếp</a>.</div>`);
        if (type === 'HLS' && window.Hls && Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(s.url); hls.attachMedia(v);
          hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail(); });
        } else { v.src = s.url; v.onerror = fail; }
        v.onended = () => { if (cur < view.length - 1) play(cur + 1); };
      }
      pl.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    } catch (err) { say(err.message + ' – thử server hoặc nguồn khác.', 'err'); }
  }
  play.n = 0;
  prov.onchange = loadEps; srv.onchange = renderEps;
  $('#prev').onclick = () => play(cur - 1); $('#next').onclick = () => play(cur + 1);
  loadEps();
}

/* ---------- Router ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  document.title = 'Mapper Cinema – Xem anime';
  window.scrollTo(0, 0);
  let m;
  if (m = h.match(/^\/a\/(\d+)/)) detail(m[1]);
  else if (m = h.match(/^\/s\/(.+)/)) { killPlayer(); list(m[1]); }
  else { killPlayer(); list(); }
}
$('#sf').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); location.hash = q ? '#/s/' + encodeURIComponent(q) : '#/'; };
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
